          cat > DeepFocus/app/src/main/java/com/deepfocus/FocusService.kt <<'DF_EOF'
          package com.deepfocus

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.SupervisorJob
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.isActive
          import kotlinx.coroutines.launch

          /** Keeps the session ticking (break end, session completion) while the app is in the background. */
          class FocusService : Service() {
              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.Main)
              private var job: Job? = null
              private var lastText = ""

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  Repo.init(applicationContext)
                  val ch = NotificationChannel(CH, "Focus session", NotificationManager.IMPORTANCE_LOW)
                  getSystemService(NotificationManager::class.java).createNotificationChannel(ch)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val s = Repo.state.value
                  val n = build(textFor(s))
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(ID, n)
                  }
                  if (job == null) {
                      job = scope.launch {
                          while (isActive) {
                              Repo.tick()
                              val st = Repo.state.value
                              if (st.phase == Phase.IDLE) {
                                  stopForeground(STOP_FOREGROUND_REMOVE)
                                  stopSelf()
                                  break
                              }
                              val text = textFor(st)
                              if (text != lastText) {
                                  lastText = text
                                  getSystemService(NotificationManager::class.java).notify(ID, build(text))
                              }
                              delay(1000)
                          }
                      }
                  }
                  return START_STICKY
              }

              private fun textFor(s: AppState): String {
                  val now = System.currentTimeMillis()
                  return when (s.phase) {
                      Phase.IDLE -> "No active session"
                      Phase.FOCUS -> {
                          val left = s.targetMin * 60_000L - Repo.elapsedMs(s, now)
                          "Focusing - ${(left + 59_999L) / 60_000L} min left"
                      }
                      Phase.PAUSED -> "Paused - credits are not accumulating"
                      Phase.BREAK -> "On break - focus resumes in ${(s.breakEnd - now + 59_999L).coerceAtLeast(0L) / 60_000L} min"
                  }
              }

              private fun build(text: String): Notification {
                  val pi = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  return Notification.Builder(this, CH)
                      .setSmallIcon(R.drawable.ic_stat)
                      .setContentTitle("Deep Focus")
                      .setContentText(text)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setContentIntent(pi)
                      .build()
              }

              override fun onDestroy() {
                  scope.cancel()
                  super.onDestroy()
              }

              companion object {
                  private const val CH = "focus"
                  private const val ID = 1
              }
          }
          DF_EOF
