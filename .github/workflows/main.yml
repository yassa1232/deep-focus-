          package com.deepfocus

          import android.content.Context
          import android.content.SharedPreferences
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import org.json.JSONArray
          import org.json.JSONObject

          enum class Phase { IDLE, FOCUS, PAUSED, BREAK }

          data class HistoryItem(val ts: Long, val credits: Int, val minutes: Int, val note: String)

          data class AppState(
              val phase: Phase = Phase.IDLE,
              val targetMin: Int = 25,
              val focusedMs: Long = 0L,
              val segmentStart: Long = 0L,
              val breakEnd: Long = 0L,
              val creditedMin: Int = 0,
              val balance: Int = 0,
              val creditsPerMin: Int = 1,
              val completionBonus: Int = 5,
              val allowed: Set<String> = emptySet(),
              val history: List<HistoryItem> = emptyList(),
          )

          /**
           * Single source of truth. Everything is based on wall-clock timestamps and saved to
           * SharedPreferences, so sessions and breaks survive app closure and phone restarts.
           * Time while the phone was off / the app was dead is NOT counted as focus time.
           */
          object Repo {
              const val BREAK_MS = 10 * 60 * 1000L

              private var prefs: SharedPreferences? = null
              private val _state = MutableStateFlow(AppState())
              val state: StateFlow<AppState> get() = _state
              private var lastBeat = 0L

              @Synchronized
              fun init(ctx: Context) {
                  if (prefs != null) return
                  val p = ctx.applicationContext.getSharedPreferences("deepfocus", Context.MODE_PRIVATE)
                  prefs = p
                  var s = load(p)
                  val now = System.currentTimeMillis()
                  val seen = p.getLong("lastSeen", 0L)
                  // The app was dead / phone was off for a while during FOCUS: count only up to the last heartbeat.
                  if (s.phase == Phase.FOCUS && seen > 0L && now - seen > 20_000L) {
                      val counted = (seen - s.segmentStart).coerceAtLeast(0L)
                      s = s.copy(focusedMs = s.focusedMs + counted, segmentStart = now)
                  }
                  _state.value = s
                  save(s)
              }

              fun elapsedMs(s: AppState, now: Long): Long {
                  val live = if (s.phase == Phase.FOCUS) (now - s.segmentStart).coerceAtLeast(0L) else 0L
                  return (s.focusedMs + live).coerceAtMost(s.targetMin * 60_000L)
              }

              private fun fold(s: AppState, now: Long): AppState =
                  if (s.phase == Phase.FOCUS) s.copy(focusedMs = elapsedMs(s, now), segmentStart = now) else s

              private fun award(s: AppState, now: Long, note: String): AppState {
                  val mins = (s.focusedMs / 60_000L).toInt()
                  val add = mins - s.creditedMin
                  if (add <= 0) return s
                  val credits = add * s.creditsPerMin
                  if (credits <= 0) return s.copy(creditedMin = mins)
                  val item = HistoryItem(now, credits, add, note)
                  return s.copy(
                      creditedMin = mins,
                      balance = s.balance + credits,
                      history = (listOf(item) + s.history).take(300),
                  )
              }

              private fun reset(s: AppState) =
                  s.copy(phase = Phase.IDLE, focusedMs = 0L, segmentStart = 0L, breakEnd = 0L, creditedMin = 0)

              private fun complete(s: AppState, now: Long): AppState {
                  var r = award(fold(s, now).copy(focusedMs = s.targetMin * 60_000L), now, "Focus session")
                  if (r.completionBonus > 0) {
                      val item = HistoryItem(now, r.completionBonus, 0, "Completion bonus")
                      r = r.copy(balance = r.balance + r.completionBonus, history = (listOf(item) + r.history).take(300))
                  }
                  return reset(r)
              }

              @Synchronized
              pri
