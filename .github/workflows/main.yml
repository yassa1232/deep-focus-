          // ------------------------------------------------------------------ SETTINGS

          data class AppInfo(val pkg: String, val label: String)

          fun loadApps(ctx: Context): List<AppInfo> {
              val pm = ctx.packageManager
              val i = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
              return pm.queryIntentActivities(i, 0)
                  .map { AppInfo(it.activityInfo.packageName, it.loadLabel(pm).toString()) }
                  .filter { it.pkg != ctx.packageName }
                  .distinctBy { it.pkg }
                  .sortedBy { it.label.lowercase() }
          }

          @Composable
          fun PermRow(title: String, desc: String, ok: Boolean, action: String, onClick: () -> Unit) {
              val cs = MaterialTheme.colorScheme
              Row(Modifier.fillMaxWidth().padding(vertical = 8.dp), verticalAlignment = Alignment.CenterVertically) {
                  Column(Modifier.weight(1f).padding(end = 8.dp)) {
                      Text(title, fontWeight = FontWeight.SemiBold)
                      Text(desc, color = cs.onSurfaceVariant, fontSize = 12.sp)
                      Text(
                          if (ok) "Enabled" else "Not enabled",
                          color = if (ok) cs.secondary else cs.error, fontSize = 12.sp, fontWeight = FontWeight.Bold,
                      )
                  }
                  SoftButton(if (ok) "Manage" else action) { onClick() }
              }
          }

          @Composable
          fun Stepper(label: String, value: Int, onChange: (Int) -> Unit) {
              Row(Modifier.fillMaxWidth().padding(vertical = 4.dp), verticalAlignment = Alignment.CenterVertically) {
                  Text(label, Modifier.weight(1f))
                  TextButton(onClick = { onChange(value - 1) }) { Text("-", fontSize = 22.sp) }
                  Text(value.toString(), fontWeight = FontWeight.Bold, fontSize = 18.sp)
                  TextButton(onClick = { onChange(value + 1) }) { Text("+", fontSize = 22.sp) }
              }
          }

          @Composable
          fun AppRow(app: AppInfo, checked: Boolean, enabled: Boolean, onToggle: () -> Unit) {
              val ctx = LocalContext.current
              val cs = MaterialTheme.colorScheme
              val icon = remember(app.pkg) {
                  runCatching { ctx.packageManager.getApplicationIcon(app.pkg).toBitmap(96, 96).asImageBitmap() }.getOrNull()
              }
              Row(
                  Modifier.fillMaxWidth()
                      .clip(RoundedCornerShape(16.dp))
                      .background(cs.surface)
                      .clickable(enabled = enabled) { onToggle() }
                      .padding(horizontal = 12.dp, vertical = 8.dp),
                  verticalAlignment = Alignment.CenterVertically,
              ) {
                  if (icon != null) Image(bitmap = icon, contentDescription = null, modifier = Modifier.size(40.dp))
                  else Spacer(Modifier.size(40.dp))
                  Spacer(Modifier.width(12.dp))
                  Text(app.label, Modifier.weight(1f), maxLines = 1, overflow = TextOverflow.Ellipsis)
                  Checkbox(checked = checked, onCheckedChange = null, enabled = enabled)
              }
          }

