          // ------------------------------------------------------------------ HOME

          @Composable
          fun HomeScreen(s: AppState, now: Long, resumeTick: Int) {
              val ctx = LocalContext.current
              val cs = MaterialTheme.colorScheme
              val blockerOn = remember(resumeTick) { Util.isBlockerEnabled(ctx) }
              var confirmEnd by remember { mutableStateOf(false) }

              val targetMs = s.targetMin * 60_000L
              val elapsed = Repo.elapsedMs(s, now)
              val idle = s.phase == Phase.IDLE
              val onBreak = s.phase == Phase.BREAK
              val breakLeft = (s.breakEnd - now).coerceAtLeast(0L)
              val shownMs = when {
                  idle -> targetMs
                  onBreak -> breakLeft
                  else -> targetMs - elapsed
              }
              val progress = when {
                  idle -> 0f
                  onBreak -> 1f - breakLeft.toFloat() / Repo.BREAK_MS
                  else -> elapsed.toFloat() / targetMs
              }
              val ringColor = if (onBreak) cs.tertiary else cs.primary
              val label = when (s.phase) {
                  Phase.IDLE -> "READY"
                  Phase.FOCUS -> "FOCUSING"
                  Phase.PAUSED -> "PAUSED"
                  Phase.BREAK -> "BREAK"
              }
              val sub = when (s.phase) {
                  Phase.IDLE -> "${s.targetMin} min session"
                  Phase.FOCUS -> "of ${s.targetMin} min"
                  Phase.PAUSED -> "no credits while paused"
                  Phase.BREAK -> "focus resumes automatically"
              }
              val sessionCredits = if (idle) 0 else (elapsed / 60_000L).toInt() * s.creditsPerMin

              Column(
                  Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(horizontal = 20.dp, vertical = 16.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
              ) {
                  Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                      Text(
                          "Deep Focus", Modifier.weight(1f),
                          fontSize = 26.sp, fontWeight = FontWeight.Bold,
                      )
                      Box(
                          Modifier.clip(RoundedCornerShape(50)).background(cs.surface)
                              .padding(horizontal = 14.dp, vertical = 8.dp)
                      ) {
                          Text("★ ${s.balance}", color = cs.secondary, fontWeight = FontWeight.Bold, fontSize = 16.sp)
                      }
                  }

                  Spacer(Modifier.height(20.dp))

                  Box(Modifier.size(270.dp), contentAlignment = Alignment.Center) {
                      val track = cs.surfaceVariant
                      Canvas(Modifier.fillMaxSize()) {
                          val stroke = 18.dp.toPx()
                          val topLeft = Offset(stroke / 2, stroke / 2)
                          val sz = Size(size.width - stroke, size.height - stroke)
                          drawArc(
                              color = track, startAngle = -90f, sweepAngle = 360f, useCenter = false,
                              topLeft = topLeft, size = sz, style = Stroke(stroke, cap = StrokeCap.Round),
                          )
                          drawArc(
                              color = ringColor, startAngle = -90f,
                              sweepAngle = 360f * progress.coerceIn(0f, 1f), useCenter = false,
                              topLeft = topLeft, size = sz, style = Stroke(stroke, cap = StrokeCap.Round),
                          )
                      }
                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                          Text(label, color = ringColor, fontSize = 13.sp, fontWeight = FontWeight.Bold, letterSpacing = 2.sp)
                          Text(Util.fmt(shownMs), fontSize = 54.sp, fontWeight = FontWeight.Bold)
                          Text(sub, color = cs.onSurfaceVariant, fontSize = 13.sp, textAlign = TextAlign.Center)
                      }
                  }

                  Spacer(Modifier.height(16.dp))

                  if (!idle) {
                      Text(
                          "+$sessionCredits credits this session",
                          color = cs.secondary, fontWeight = FontWeight.SemiBold,
                      )
                      Spacer(Modifier.height(16.dp))
                  }

                  if (idle) {
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          listOf(15, 25, 45, 60, 90).forEach { m ->
                              Pill("$m", s.targetMin == m, Modifier.weight(1f)) { Repo.setTarget(m) }
                          }
                      }
                      Text(
                          "minutes", color = cs.onSurfaceVariant, fontSize = 12.sp,
                          modifier = Modifier.padding(top = 6.dp, bottom = 16.dp),
                      )
                      if (!blockerOn) {
                          DCard(Modifier.padding(bottom = 16.dp)) {
                              Text("App blocking is OFF", color = cs.tertiary, fontWeight = FontWeight.Bold)
                              Text(
                                  "Turn on the Deep Focus accessibility service (Settings tab) so other apps get blocked. " +
                                      "The timer works without it, but nothing will be blocked.",
                                  color = cs.onSurfaceVariant, fontSize = 13.sp,
                              )
                          }
                      }
                      BigButton("Start Focus", cs.primary, cs.onPrimary, 60) {
                          Repo.start()
                          Util.startService(ctx)
                      }
                  } else if (onBreak) {
                      BigButton("Resume Focus Now", cs.primary, cs.onPrimary) { Repo.endBreak() }
                      Spacer(Modifier.height(12.dp))
                      SoftButton("End Session", Modifier.fillMaxWidth()) { confirmEnd = true }
                  } else {
                      BigButton("Break 10 Minutes", cs.tertiary, cs.onTertiary, 68) { Repo.startBreak() }
                      Spacer(Modifier.height(12.dp))
                      Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                          if (s.phase == Phase.FOCUS) {
                              SoftButton("Pause", Modifier.weight(1f)) { Repo.pause() }
                          } else {
                              SoftButton("Resume", Modifier.weight(1f)) { Repo.resume() }
                          }
                          SoftButton("End", Modifier.weight(1f)) { confirmEnd = true }
                      }
                  }
              }

              if (confirmEnd) {
                  AlertDialog(
                      onDismissRequest = { confirmEnd = false },
                      title = { Text("End session?") },
                      text = { Text("You keep the credits you already earned. No credits for time you did not focus.") },
                      confirmButton = { TextButton(onClick = { confirmEnd = false; Repo.end() }) { Text("End session") } },
                      dismissButton = { TextButton(onClick = { confirmEnd = false }) { Text("Keep going") } },
                      containerColor = cs.surface,
                  )
              }
          }

