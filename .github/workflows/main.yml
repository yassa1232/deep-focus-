          cat > DeepFocus/app/src/main/java/com/deepfocus/BlockService.kt <<'DF_EOF'
          package com.deepfocus

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.view.accessibility.AccessibilityEvent
          import android.view.inputmethod.InputMethodManager
          import android.widget.Toast

          /**
           * Accessibility-based blocker. It only looks at WHICH app came to the front
           * (package name). It does not read screen content and has no internet permission.
           * During a session (focus, paused or break) any app that is not allowed is sent to the home screen.
           */
          class BlockService : AccessibilityService() {
              private var safe: Set<String> = emptySet()
              private var safeAt = 0L
              private var lastToast = 0L

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  Repo.init(applicationContext)
                  refreshSafe()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null || event.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  val pkg = event.packageName?.toString() ?: return
                  val s = Repo.state.value
                  if (s.phase == Phase.IDLE) return
                  if (pkg == packageName || pkg in s.allowed) return
                  val now = System.currentTimeMillis()
                  if (now - safeAt > 60_000L) refreshSafe()
                  if (pkg in safe) return
                  performGlobalAction(GLOBAL_ACTION_HOME)
                  if (now - lastToast > 2_000L) {
                      lastToast = now
                      Toast.makeText(this, "Deep Focus: app blocked during your session", Toast.LENGTH_SHORT).show()
                  }
              }

              override fun onInterrupt() {}

              /** System pieces that must always work: launcher, status bar, keyboard, dialer. */
              private fun refreshSafe() {
                  val set = mutableSetOf("com.android.systemui", "android")
                  runCatching {
                      val pm = packageManager
                      pm.queryIntentActivities(
                          Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME), 0
                      ).forEach { set += it.activityInfo.packageName }
                      pm.queryIntentActivities(Intent(Intent.ACTION_DIAL), 0)
                          .forEach { set += it.activityInfo.packageName }
                      (getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager)
                          .enabledInputMethodList.forEach { set += it.packageName }
                  }
                  safe = set
                  safeAt = System.currentTimeMillis()
              }
          }
