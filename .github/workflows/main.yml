          class MainActivity : ComponentActivity() {
              private val resumeTick = mutableIntStateOf(0)
              private val notifLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestPermission()) { resumeTick.intValue++ }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Repo.init(applicationContext)
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      notifLauncher.launch(Manifest.permission.POST_NOTIFICATIONS)
                  }
                  setContent { DeepFocusTheme { AppRoot(resumeTick.intValue) } }
              }

              override fun onResume() {
                  super.onResume()
                  resumeTick.intValue++
                  if (Repo.state.value.phase != Phase.IDLE) Util.startService(this)
              }
          }

          @Composable
          fun AppRoot(resumeTick: Int) {
              val state by Repo.state.collectAsState()
              var tab by remember { mutableIntStateOf(0) }
              var now by remember { mutableLongStateOf(System.currentTimeMillis()) }
              LaunchedEffect(Unit) {
                  while (true) {
                      Repo.tick()
                      now = System.currentTimeMillis()
                      delay(500)
                  }
              }
              val cs = MaterialTheme.colorScheme
              val navColors = NavigationBarItemDefaults.colors(
                  selectedIconColor = cs.onPrimary,
                  selectedTextColor = cs.primary,
                  indicatorColor = cs.primary,
                  unselectedIconColor = cs.onSurfaceVariant,
                  unselectedTextColor = cs.onSurfaceVariant,
              )
              Scaffold(
                  containerColor = cs.background,
                  bottomBar = {
                      NavigationBar(containerColor = cs.surface) {
                          NavigationBarItem(
                              selected = tab == 0, onClick = { tab = 0 }, colors = navColors,
                              icon = { Icon(Icons.Filled.Home, contentDescription = null) }, label = { Text("Focus") })
                          NavigationBarItem(
                              selected = tab == 1, onClick = { tab = 1 }, colors = navColors,
                              icon = { Icon(Icons.Filled.Star, contentDescription = null) }, label = { Text("Wallet") })
                          NavigationBarItem(
                              selected = tab == 2, onClick = { tab = 2 }, colors = navColors,
                              icon = { Icon(Icons.Filled.Settings, contentDescription = null) }, label = { Text("Settings") })
                      }
                  }
              ) { pad ->
                  Box(Modifier.padding(pad).fillMaxSize()) {
                      when (tab) {
                          0 -> HomeScreen(state, now, resumeTick)
                          1 -> WalletScreen(state)
                          else -> SettingsScreen(state, resumeTick)
                      }
                  }
              }
          }

          @Composable
          fun DCard(modifier: Modifier = Modifier, content: @Composable ColumnScope.() -> Unit) {
              Card(
                  modifier = modifier.fillMaxWidth(),
                  shape = RoundedCornerShape(24.dp),
